services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pythia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pythia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pythia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ML Predictions Backend (pythia_divination)
  divination-api:
    build:
      context: ./pythia_divination
      dockerfile: Dockerfile
    container_name: pythia-divination
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pythia_secret}@postgres:5432/${POSTGRES_DB:-pythia}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://data.alpaca.markets/v2}
      DATA_SOURCE: ${DATA_SOURCE:-yahoo}
      # S3 Configuration
      S3_BUCKET: ${S3_BUCKET:-pythia-ml-artifacts}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      ARTIFACTS_DIR: /app/artifacts
      HOME_CACHE_MODELS: ${HOME_CACHE_MODELS:-lstm_5d,lstm_jackpot}
      HOME_CACHE_TICKERS: ${HOME_CACHE_TICKERS:-AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META}
      CACHE_ALL_LSTM_PREDICTIONS: ${CACHE_ALL_LSTM_PREDICTIONS:-false}
      LSTM_RESPONSE_CACHE_TTL_SECONDS: ${LSTM_RESPONSE_CACHE_TTL_SECONDS:-900}
      LSTM_STALE_CACHE_TTL_SECONDS: ${LSTM_STALE_CACHE_TTL_SECONDS:-3600}
      LSTM_RAW_DATA_CACHE_TTL_SECONDS: ${LSTM_RAW_DATA_CACHE_TTL_SECONDS:-600}
      LSTM_RAW_DATA_STALE_TTL_SECONDS: ${LSTM_RAW_DATA_STALE_TTL_SECONDS:-86400}
      LSTM_SINGLEFLIGHT_WAIT_SECONDS: ${LSTM_SINGLEFLIGHT_WAIT_SECONDS:-3}
      HOME_CACHE_WARM_ENABLED: ${HOME_CACHE_WARM_ENABLED:-true}
      HOME_CACHE_WARM_ON_STARTUP: ${HOME_CACHE_WARM_ON_STARTUP:-true}
      HOME_CACHE_WARM_INTERVAL_SECONDS: ${HOME_CACHE_WARM_INTERVAL_SECONDS:-900}
      HOME_CACHE_SNAPSHOT_PATH: ${HOME_CACHE_SNAPSHOT_PATH:-/app/artifacts/home_cache_snapshot.json}
    ports:
      - "8000:8000"
    volumes:
      - ./pythia_divination/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # Auth/User Management Backend (pythia_prophecy)
  prophecy-api:
    build:
      context: ./pythia_prophecy
      dockerfile: Dockerfile
    container_name: pythia-prophecy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      EMAIL_DEV_MODE: ${EMAIL_DEV_MODE:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@seekingbeta.ai}
      FROM_NAME: ${FROM_NAME:-SeekingBeta}
      POLICY_VERSION: ${POLICY_VERSION:-2026-02-27}
      EMAIL_RETRY_ATTEMPTS: ${EMAIL_RETRY_ATTEMPTS:-3}
      EMAIL_RETRY_DELAY: ${EMAIL_RETRY_DELAY:-5}
      EMAIL_SUPPRESSION_ENABLED: ${EMAIL_SUPPRESSION_ENABLED:-true}
      SES_SNS_ALLOWED_TOPIC_ARNS: ${SES_SNS_ALLOWED_TOPIC_ARNS:-}
      SES_SNS_AUTO_CONFIRM: ${SES_SNS_AUTO_CONFIRM:-false}
      PYTHIA_API_URL: http://divination-api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pythia_secret}@postgres:5432/${POSTGRES_DB:-pythia}
      ALLOW_RANDOM_FALLBACK: ${ALLOW_RANDOM_FALLBACK:-false}
    ports:
      - "8001:8001"
    volumes:
      - prophecy_data:/app/data
    depends_on:
      - divination-api
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # React Frontend (nginx)
  frontend:
    build:
      context: ./pythia_prophecy/frontend
      dockerfile: Dockerfile
    container_name: pythia-frontend
    ports:
      - "80:80"
    depends_on:
      - divination-api
      - prophecy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  prophecy_data:

networks:
  default:
    name: pythia-network
