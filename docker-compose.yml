services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pythia-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pythia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pythia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ML Predictions Backend (pythia_divination)
  divination-api:
    build:
      context: ./pythia_divination
      dockerfile: Dockerfile
    container_name: pythia-divination
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pythia_secret}@postgres:5432/${POSTGRES_DB:-pythia}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://data.alpaca.markets/v2}
      DATA_SOURCE: ${DATA_SOURCE:-yahoo}
      # Thread caps: the box has 2 cores shared with postgres/prophecy/frontend.
      # torch/numpy/scipy/BLAS default to grabbing every core, which oversubscribes
      # and thrashes (observed 169% CPU) when a heavy job (soccer Dixon-Coles refit
      # + World Cup sim) runs, stalling all concurrent sports requests. Cap them.
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-1}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-1}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-1}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-1}
      # S3 Configuration
      S3_BUCKET: ${S3_BUCKET:-pythia-ml-artifacts}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      ARTIFACTS_DIR: /app/artifacts
      # Auto-restore artifacts from S3 on container start (download_artifacts.sh).
      # Default off; set AUTO_DOWNLOAD_ARTIFACTS=true in .env once the bucket is
      # populated. STRICT=true makes a failed download abort startup.
      AUTO_DOWNLOAD_ARTIFACTS: ${AUTO_DOWNLOAD_ARTIFACTS:-false}
      STRICT_ARTIFACT_DOWNLOAD: ${STRICT_ARTIFACT_DOWNLOAD:-false}
      HOME_CACHE_MODELS: ${HOME_CACHE_MODELS:-lstm_5d,lstm_jackpot,lstm_quant}
      HOME_CACHE_TICKERS: ${HOME_CACHE_TICKERS:-AAPL,MSFT,GOOGL,AMZN,NVDA,TSLA,META}
      CACHE_ALL_LSTM_PREDICTIONS: ${CACHE_ALL_LSTM_PREDICTIONS:-false}
      LSTM_RESPONSE_CACHE_TTL_SECONDS: ${LSTM_RESPONSE_CACHE_TTL_SECONDS:-900}
      LSTM_STALE_CACHE_TTL_SECONDS: ${LSTM_STALE_CACHE_TTL_SECONDS:-3600}
      LSTM_RAW_DATA_CACHE_TTL_SECONDS: ${LSTM_RAW_DATA_CACHE_TTL_SECONDS:-600}
      LSTM_RAW_DATA_STALE_TTL_SECONDS: ${LSTM_RAW_DATA_STALE_TTL_SECONDS:-86400}
      LSTM_SINGLEFLIGHT_WAIT_SECONDS: ${LSTM_SINGLEFLIGHT_WAIT_SECONDS:-3}
      HOME_CACHE_WARM_ENABLED: ${HOME_CACHE_WARM_ENABLED:-true}
      HOME_CACHE_WARM_ON_STARTUP: ${HOME_CACHE_WARM_ON_STARTUP:-true}
      HOME_CACHE_WARM_INTERVAL_SECONDS: ${HOME_CACHE_WARM_INTERVAL_SECONDS:-900}
      HOME_CACHE_SNAPSHOT_PATH: ${HOME_CACHE_SNAPSHOT_PATH:-/app/artifacts/home_cache_snapshot.json}
      HOMEPAGE_CACHE_ONLY: ${HOMEPAGE_CACHE_ONLY:-true}
      LSTM_SERVE_CACHE_ONLY: ${LSTM_SERVE_CACHE_ONLY:-false}
      LSTM_DB_MARKET_DATA_ENABLED: ${LSTM_DB_MARKET_DATA_ENABLED:-true}
      LSTM_ALLOW_LIVE_DATA_FETCH: ${LSTM_ALLOW_LIVE_DATA_FETCH:-true}
      MARKET_DATA_SYNC_ENABLED: ${MARKET_DATA_SYNC_ENABLED:-false}
      MARKET_DATA_SYNC_INTERVAL_SECONDS: ${MARKET_DATA_SYNC_INTERVAL_SECONDS:-86400}
      MARKET_DATA_SYNC_BATCH_SIZE: ${MARKET_DATA_SYNC_BATCH_SIZE:-250}
      MARKET_DATA_SYNC_MAX_AGE_DAYS: ${MARKET_DATA_SYNC_MAX_AGE_DAYS:-1}
      MARKET_DATA_SYNC_LOOKBACK_DAYS: ${MARKET_DATA_SYNC_LOOKBACK_DAYS:-520}
      MARKET_DATA_SYNC_SOURCE: ${MARKET_DATA_SYNC_SOURCE:-stooq}
      MARKET_DATA_SYNC_TICKERS: ${MARKET_DATA_SYNC_TICKERS:-}
      # lstm_quant options flow: "yfinance" (free, BS greeks) or "schwab" (real greeks,
      # needs an OAuth token via scripts/schwab_auth.py; falls back to yfinance if absent).
      QUANT_OPTIONS_SOURCE: ${QUANT_OPTIONS_SOURCE:-yfinance}
      SCHWAB_APP_KEY: ${SCHWAB_APP_KEY:-}
      SCHWAB_APP_SECRET: ${SCHWAB_APP_SECRET:-}
      SCHWAB_CALLBACK_URL: ${SCHWAB_CALLBACK_URL:-https://127.0.0.1:8182}
      # Token lives on the mounted artifacts volume so it survives container rebuilds.
      SCHWAB_TOKEN_PATH: ${SCHWAB_TOKEN_PATH:-/app/artifacts/schwab_token.json}
      # Daily options-feature archive (lstm_quant): snapshot -> Postgres + S3 mirror.
      OPTIONS_ARCHIVE_ENABLED: ${OPTIONS_ARCHIVE_ENABLED:-true}
      OPTIONS_ARCHIVE_HOUR_UTC: ${OPTIONS_ARCHIVE_HOUR_UTC:-21}
      OPTIONS_ARCHIVE_TICKERS: ${OPTIONS_ARCHIVE_TICKERS:-}
      # Inter-symbol delay (ms) so the full-universe sweep stays under Schwab rate limits.
      OPTIONS_ARCHIVE_SLEEP_MS: ${OPTIONS_ARCHIVE_SLEEP_MS:-750}
      OPTIONS_ARCHIVE_S3_PREFIX: ${OPTIONS_ARCHIVE_S3_PREFIX:-options_archive}
    ports:
      - "8000:8000"
    volumes:
      - ./pythia_divination/artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # OOM guardrail: on 2026-06-11 this container's python grew to ~6.7GB RSS,
    # exhausted the host's 8GB RAM + 4GB swap, and swap-thrashed the whole box
    # offline (SSH included) until a hard reboot. Cap it so the kernel kills and
    # Docker restarts just this container instead of taking down the host.
    mem_limit: 5g
    memswap_limit: 6g

  # Dedicated MLB trainer (torch + Statcast) isolated from the live API image
  mlb-trainer:
    profiles: ["training"]
    build:
      context: ./pythia_divination
      dockerfile: Dockerfile.mlb-trainer
    container_name: pythia-mlb-trainer
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    working_dir: /app
    volumes:
      - ./pythia_divination/artifacts:/app/artifacts
      - ./pythia_divination/data:/app/data
    command: ["sh", "-lc", "sleep infinity"]
    restart: unless-stopped

  # Auth/User Management Backend (pythia_prophecy)
  prophecy-api:
    build:
      context: ./pythia_prophecy
      dockerfile: Dockerfile
    container_name: pythia-prophecy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_in_production}
      EMAIL_DEV_MODE: ${EMAIL_DEV_MODE:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-noreply@seekingbeta.ai}
      FROM_NAME: ${FROM_NAME:-SeekingBeta}
      POLICY_VERSION: ${POLICY_VERSION:-2026-02-27}
      STRIPE_ENABLED: ${STRIPE_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_BASIC_MONTHLY: ${STRIPE_PRICE_BASIC_MONTHLY:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_BILLING_PORTAL_RETURN_URL: ${STRIPE_BILLING_PORTAL_RETURN_URL:-}
      STRIPE_LEGACY_GRACE_DAYS: ${STRIPE_LEGACY_GRACE_DAYS:-30}
      AUTH_SIGNUP_RATE_LIMIT: ${AUTH_SIGNUP_RATE_LIMIT:-5}
      AUTH_SIGNUP_RATE_WINDOW_SECONDS: ${AUTH_SIGNUP_RATE_WINDOW_SECONDS:-3600}
      AUTH_SIGNUP_IP_RATE_LIMIT: ${AUTH_SIGNUP_IP_RATE_LIMIT:-30}
      AUTH_SIGNUP_IP_RATE_WINDOW_SECONDS: ${AUTH_SIGNUP_IP_RATE_WINDOW_SECONDS:-3600}
      AUTH_LOGIN_RATE_LIMIT: ${AUTH_LOGIN_RATE_LIMIT:-10}
      AUTH_LOGIN_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_RATE_WINDOW_SECONDS:-3600}
      AUTH_LOGIN_IP_RATE_LIMIT: ${AUTH_LOGIN_IP_RATE_LIMIT:-120}
      AUTH_LOGIN_IP_RATE_WINDOW_SECONDS: ${AUTH_LOGIN_IP_RATE_WINDOW_SECONDS:-3600}
      AUTH_VERIFY_RATE_LIMIT: ${AUTH_VERIFY_RATE_LIMIT:-20}
      AUTH_VERIFY_RATE_WINDOW_SECONDS: ${AUTH_VERIFY_RATE_WINDOW_SECONDS:-3600}
      AUTH_RESEND_RATE_LIMIT: ${AUTH_RESEND_RATE_LIMIT:-1}
      AUTH_RESEND_RATE_WINDOW_SECONDS: ${AUTH_RESEND_RATE_WINDOW_SECONDS:-60}
      AUTH_PASSWORD_RESET_RATE_LIMIT: ${AUTH_PASSWORD_RESET_RATE_LIMIT:-5}
      AUTH_PASSWORD_RESET_RATE_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_RATE_WINDOW_SECONDS:-900}
      AUTH_PASSWORD_RESET_CONFIRM_RATE_LIMIT: ${AUTH_PASSWORD_RESET_CONFIRM_RATE_LIMIT:-10}
      AUTH_PASSWORD_RESET_CONFIRM_RATE_WINDOW_SECONDS: ${AUTH_PASSWORD_RESET_CONFIRM_RATE_WINDOW_SECONDS:-3600}
      AUTH_REFRESH_RATE_LIMIT: ${AUTH_REFRESH_RATE_LIMIT:-60}
      AUTH_REFRESH_RATE_WINDOW_SECONDS: ${AUTH_REFRESH_RATE_WINDOW_SECONDS:-300}
      AUTH_CHANGE_PASSWORD_RATE_LIMIT: ${AUTH_CHANGE_PASSWORD_RATE_LIMIT:-5}
      AUTH_CHANGE_PASSWORD_RATE_WINDOW_SECONDS: ${AUTH_CHANGE_PASSWORD_RATE_WINDOW_SECONDS:-3600}
      AUTH_DELETE_ACCOUNT_RATE_LIMIT: ${AUTH_DELETE_ACCOUNT_RATE_LIMIT:-3}
      AUTH_DELETE_ACCOUNT_RATE_WINDOW_SECONDS: ${AUTH_DELETE_ACCOUNT_RATE_WINDOW_SECONDS:-3600}
      EMAIL_RETRY_ATTEMPTS: ${EMAIL_RETRY_ATTEMPTS:-3}
      EMAIL_RETRY_DELAY: ${EMAIL_RETRY_DELAY:-5}
      EMAIL_SUPPRESSION_ENABLED: ${EMAIL_SUPPRESSION_ENABLED:-true}
      SES_SNS_ALLOWED_TOPIC_ARNS: ${SES_SNS_ALLOWED_TOPIC_ARNS:-}
      SES_SNS_AUTO_CONFIRM: ${SES_SNS_AUTO_CONFIRM:-false}
      SES_WEBHOOK_RATE_LIMIT: ${SES_WEBHOOK_RATE_LIMIT:-240}
      SES_WEBHOOK_RATE_WINDOW_SECONDS: ${SES_WEBHOOK_RATE_WINDOW_SECONDS:-60}
      STRIPE_WEBHOOK_RATE_LIMIT: ${STRIPE_WEBHOOK_RATE_LIMIT:-240}
      STRIPE_WEBHOOK_RATE_WINDOW_SECONDS: ${STRIPE_WEBHOOK_RATE_WINDOW_SECONDS:-60}
      # Google Play Billing (Android subscriptions). Flags/paths come from the box
      # .env; the service-account JSON is mounted read-only via the volume below
      # (GOOGLE_SERVICE_ACCOUNT_FILE points at /app/secrets/play-service-account.json).
      GOOGLE_PLAY_ENABLED: ${GOOGLE_PLAY_ENABLED:-false}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.enens.seekingbeta}
      GOOGLE_PLAY_PRODUCT_BASIC_MONTHLY: ${GOOGLE_PLAY_PRODUCT_BASIC_MONTHLY:-basic-monthly}
      GOOGLE_PLAY_PRODUCT_PRO_MONTHLY: ${GOOGLE_PLAY_PRODUCT_PRO_MONTHLY:-pro-monthly}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_RTDN_AUDIENCE: ${GOOGLE_RTDN_AUDIENCE:-}
      # TRUE only during closed/internal testing so license-tester (test) purchases
      # grant entitlement. MUST be false for the real public launch.
      GOOGLE_PLAY_ALLOW_TEST_PURCHASES: ${GOOGLE_PLAY_ALLOW_TEST_PURCHASES:-false}
      # --- Social login (Apple + Google + Facebook). Provider-agnostic verify. ---
      # Master gate; while false the /api/auth/oauth endpoint 404s.
      SOCIAL_LOGIN_ENABLED: ${SOCIAL_LOGIN_ENABLED:-false}
      # Google: allow-list ALL platform OAuth client IDs as valid token audiences.
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      # Apple: allow-list Bundle ID (iOS native) + Services ID (web / Android).
      APPLE_OAUTH_BUNDLE_ID: ${APPLE_OAUTH_BUNDLE_ID:-}
      APPLE_OAUTH_SERVICES_ID: ${APPLE_OAUTH_SERVICES_ID:-}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID:-}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID:-}
      # Apple .p8 rides the existing read-only secrets mount (like the Play SA JSON).
      APPLE_OAUTH_PRIVATE_KEY_FILE: ${APPLE_OAUTH_PRIVATE_KEY_FILE:-/app/secrets/apple-signin-key.p8}
      # Web/Services-ID auth-code exchange + revoke (omit for native iOS).
      APPLE_OAUTH_REDIRECT_URI: ${APPLE_OAUTH_REDIRECT_URI:-}
      # Facebook: server-to-server debug_token + Graph /me.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v19.0}
      # Public base for the Facebook data-deletion status URL Meta shows users.
      DATA_DELETION_STATUS_BASE_URL: ${DATA_DELETION_STATUS_BASE_URL:-https://seekingbeta.ai}
      PYTHIA_API_URL: http://divination-api:8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pythia_secret}@postgres:5432/${POSTGRES_DB:-pythia}
      ALPACA_KEY_ID: ${ALPACA_KEY_ID:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_TRADING_BASE_URL: ${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets}
      COMPANY_AUTO_POPULATE_ON_DEMAND: ${COMPANY_AUTO_POPULATE_ON_DEMAND:-true}
      ALLOW_RANDOM_FALLBACK: ${ALLOW_RANDOM_FALLBACK:-false}
      DIVINATION_LSTM_TIMEOUT_SECONDS: ${DIVINATION_LSTM_TIMEOUT_SECONDS:-8}
      LSTM_PROXY_DISABLE_LOCAL_FALLBACK: ${LSTM_PROXY_DISABLE_LOCAL_FALLBACK:-true}
      FINVIZ_API_BASE_URL: ${FINVIZ_API_BASE_URL:-}
      FINVIZ_API_KEY: ${FINVIZ_API_KEY:-}
      FINVIZ_API_AUTH_HEADER: ${FINVIZ_API_AUTH_HEADER:-X-API-KEY}
      FINVIZ_API_KEY_PREFIX: ${FINVIZ_API_KEY_PREFIX:-}
      FINVIZ_API_AUTH_QUERY_PARAM: ${FINVIZ_API_AUTH_QUERY_PARAM:-auth}
      FINVIZ_API_QUOTE_PATH_TEMPLATE: ${FINVIZ_API_QUOTE_PATH_TEMPLATE:-/quote/{ticker}}
      FINVIZ_CHART_URL_TEMPLATE: ${FINVIZ_CHART_URL_TEMPLATE:-https://finviz.com/chart.ashx?t={ticker}&ty=c&ta=1&p=d&s=l}
      FINVIZ_API_TIMEOUT_SECONDS: ${FINVIZ_API_TIMEOUT_SECONDS:-8}
      FINVIZ_INSIGHTS_CACHE_TTL_SECONDS: ${FINVIZ_INSIGHTS_CACHE_TTL_SECONDS:-120}
    ports:
      - "8001:8001"
    volumes:
      - prophecy_data:/app/data
      - ./pythia_prophecy/data/backtests:/app/data/backtests:ro
      # Google Play service-account JSON (gitignored, placed on the host only).
      - ./pythia_prophecy/secrets:/app/secrets:ro
    depends_on:
      - divination-api
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # React Frontend (nginx)
  frontend:
    build:
      context: ./pythia_prophecy/frontend
      dockerfile: Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        # Social login (baked into the bundle at build time).
        VITE_SOCIAL_LOGIN_ENABLED: ${VITE_SOCIAL_LOGIN_ENABLED:-false}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_FACEBOOK_APP_ID: ${VITE_FACEBOOK_APP_ID:-}
        VITE_FACEBOOK_GRAPH_VERSION: ${VITE_FACEBOOK_GRAPH_VERSION:-v19.0}
        VITE_APPLE_SERVICES_ID: ${VITE_APPLE_SERVICES_ID:-}
        VITE_APPLE_REDIRECT_URI: ${VITE_APPLE_REDIRECT_URI:-}
    container_name: pythia-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - divination-api
      - prophecy-api
    healthcheck:
      # Probe HTTPS directly: nginx 301-redirects http->https, and wget follows
      # the redirect to a cert issued for seekingbeta.ai (not "localhost"), failing
      # SSL verification (exit 5) and marking the container falsely "unhealthy".
      # Hit https with --no-check-certificate against the static root (no backend
      # dependency) so the check reflects nginx actually serving.
      test: ["CMD", "wget", "-q", "-T", "4", "--spider", "--no-check-certificate", "https://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  prophecy_data:

networks:
  default:
    name: pythia-network
