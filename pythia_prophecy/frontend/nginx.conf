proxy_cache_path /var/cache/nginx/pred_cache levels=1:2 keys_zone=pred_cache:20m inactive=30m max_size=256m;

server {
    listen 80;
    server_name seekingbeta.ai www.seekingbeta.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name seekingbeta.ai www.seekingbeta.ai;

    ssl_certificate /etc/letsencrypt/live/seekingbeta.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seekingbeta.ai/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        proxy_pass http://prophecy-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /predict/ {
        proxy_cache pred_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504 updating;
        add_header X-Prediction-Cache $upstream_cache_status always;
        proxy_pass http://divination-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /healthz {
        proxy_pass http://divination-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/(portfolio|paper|simulate|data)/ {
        proxy_pass http://divination-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type application/json;
        try_files $uri =404;
    }

    # HTML must always revalidate: without this, browsers heuristically cache
    # index.html (root and the prerendered /<route>/index.html copies) and keep
    # loading the previous JS bundle after deploys (new routes like /support
    # then fall into the old router's catch-all). The hashed /assets/* below
    # stay immutable; ETag makes revalidation a 304. $uri/ serves the
    # prerendered dist/<route>/index.html for SEO routes via the index module.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
